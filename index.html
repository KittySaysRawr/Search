<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreenMeans: Search</title>
    <meta name="description" content="Discover a Greener way to search. GreenMeans lets you choose your favorite search engine whilst being eco-friendly and privacy-focused.">
    <meta name="keywords" content="eco-friendly search, green search, privacy search, search aggregator, Ecosia, DuckDuckGo, private search, climate action, search choices">
    <meta name="author" content="GreenMeans">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://search.greenmeans.ovh/">
    <meta property="og:title" content="GreenMeans: Search">
    <meta property="og:description" content="Choose your favorite search engine. Start reducing your digital footprint one query at a time.">
    <meta property="og:image" content="https://search.greenmeans.ovh/favicon-round.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://search.greenmeans.ovh/">
    <meta property="twitter:title" content="GreenMeans: Search">
    <meta property="twitter:description" content="Choose your favorite search engine. Start reducing your digital footprint one query at a time.">
    <meta property="twitter:image" content="https://search.greenmeans.ovh/favicon-round.svg">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GreenMeans: Search",
      "url": "https://search.greenmeans.ovh/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://search.greenmeans.ovh/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-round.svg">
    <link rel="shortcut icon" href="/favicon-round.svg">
    <link rel="apple-touch-icon" href="/favicon-round.svg">
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        'xs': '475px',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        dyslexic: ['Lexend', 'Open Sans', 'sans-serif'],
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#047857',
                            700: '#065f46',
                            800: '#064e3b',
                            900: '#022c22',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-black text-white selection:bg-[#18832b]/30 selection:text-white transition-colors duration-300">
    <!-- Internal Analytics -->
    <script defer src="https://info.greenmeans.ovh/assets_vital_metrics" data-website-id="cf384752-4365-4c51-b3d2-4e27b3807033"></script>
    <noscript><img src="https://info.greenmeans.ovh/p/UtLkxMPD4" alt="" role="presentation" aria-hidden="true" width="1" height="1" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;" loading="eager" /></noscript>

    <!-- Screen reader only h1 for SEO matching user requirements -->
    <h1 class="sr-only">GreenMeans: Your Eco-Friendly Search Aggregator for a Greener Web</h1>
    
    <div id="root"></div>

    <!-- React, ReactDOM, Babel, and Lucide CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>

    <!-- App Logic -->
    <script type="module" src="/script.js"></script>
</body>
</html>
