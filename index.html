<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMeans: Search</title>
    <meta name="description" content="The search for a greener web. Choose your provider and search with accessibility by default.">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        dyslexic: ['Open Sans', 'sans-serif'],
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .dyslexia-mode {
            font-family: 'Open Sans', system-ui, sans-serif !important;
            line-height: 1.8 !important;
            letter-spacing: 0.05em !important;
            word-spacing: 0.1em !important;
        }

        .dyslexia-mode p, .dyslexia-mode h1, .dyslexia-mode h2, .dyslexia-mode h3, .dyslexia-mode span, .dyslexia-mode input {
            font-family: 'Open Sans', system-ui, sans-serif !important;
        }

        .reduced-motion * {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }

        /* Custom Scrollbar for Dropdown */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            border-radius: 9999px;
            background-color: #e2e8f0; /* bg-slate-200 */
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: #1e293b; /* bg-slate-800 */
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

    <!-- React, ReactDOM, Babel, and Lucide CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>

    <!-- App Logic -->
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SEARCH_ENGINES = {
            google: {
                name: 'Google',
                url: 'https://www.google.com/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=google.com&sz=64',
                description: "The world's most popular search engine."
            },
            bing: {
                name: 'Bing',
                url: 'https://www.bing.com/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=bing.com&sz=64',
                description: "Microsoft's search experience with rich visual results."
            },
            duckduckgo: {
                name: 'DuckDuckGo',
                url: 'https://duckduckgo.com',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=64',
                description: "Privacy-focused search that doesn't track you."
            },
            ecosia: {
                name: 'Ecosia',
                url: 'https://www.ecosia.org/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=ecosia.org&sz=64',
                description: "The search engine that plants trees while you search."
            }
        };

        function App() {
            // --- State Persistence ---
            const [query, setQuery] = useState('');
            const [engine, setEngine] = useState(() => {
                return localStorage.getItem('gm-engine') || 'ecosia';
            });
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('gm-dark-mode') === 'true' || 
                       (!('gm-dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });
            const [reducedMotion, setReducedMotion] = useState(() => localStorage.getItem('gm-reduced-motion') === 'true');
            const [dyslexiaMode, setDyslexiaMode] = useState(() => localStorage.getItem('gm-dyslexia-mode') === 'true');
            
            // --- UI State ---
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            // --- Handlers ---
            useEffect(() => {
                localStorage.setItem('gm-engine', engine);
                localStorage.setItem('gm-dark-mode', darkMode);
                localStorage.setItem('gm-reduced-motion', reducedMotion);
                localStorage.setItem('gm-dyslexia-mode', dyslexiaMode);

                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                if (dyslexiaMode) {
                    document.body.classList.add('dyslexia-mode');
                } else {
                    document.body.classList.remove('dyslexia-mode');
                }

                if (reducedMotion) {
                    document.body.classList.add('reduced-motion');
                } else {
                    document.body.classList.remove('reduced-motion');
                }
            }, [darkMode, dyslexiaMode, reducedMotion, engine]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsDropdownOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSearch = (e) => {
                e?.preventDefault();
                if (!query.trim()) return;

                const selectedEngine = SEARCH_ENGINES[engine];
                const searchUrl = `${selectedEngine.url}?${selectedEngine.queryParam}=${encodeURIComponent(query)}`;
                window.open(searchUrl, '_blank');
            };

            // Lucide Icons Helper Component
            // Wrapped in a stable span to prevent React from crashing when Lucide replaces the node
            const Icon = ({ name, className = "w-5 h-5" }) => {
                const containerRef = useRef(null);
                
                useEffect(() => {
                    if (containerRef.current) {
                        // Standard UMD Lucide manipulation inside a safe container
                        // Clear previous content to avoid duplicate icons on re-render
                        containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                        lucide.createIcons({
                            attrs: { class: className },
                            nameAttr: 'data-lucide',
                            icons: { [name]: lucide[name] },
                            root: containerRef.current
                        });
                    }
                }, [name, className]);

                return <span ref={containerRef} className="inline-flex items-center justify-center" aria-hidden="true"></span>;
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="fixed top-0 left-0 right-0 z-40 p-6 flex justify-between items-center bg-transparent">
                        <div className="flex items-center gap-2 group cursor-default">
                            <div className="w-10 h-10 overflow-hidden rounded-xl shadow-lg shadow-emerald-600/20 group-hover:rotate-12 transition-transform bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 flex items-center justify-center">
                                <img src="/favicon.png" alt="GreenMeans Logo" className="w-full h-full object-cover" />
                            </div>
                            <h1 className="text-xl font-bold tracking-tight hidden sm:block">GreenMeans</h1>
                        </div>

                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-xl shadow-sm hover:scale-110 active:scale-95 transition-all text-slate-600 dark:text-slate-300"
                                aria-label="Settings"
                            >
                                <Icon name="Settings" />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-center p-6 relative">
                        {/* Decorative background blobs */}
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none" />
                        <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-teal-500/5 rounded-full blur-3xl pointer-events-none" />

                        <div className="w-full max-w-2xl flex flex-col items-center gap-12 z-10">
                            <div className="text-center animate-in fade-in slide-in-from-bottom-4 duration-700">
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight mb-4 text-slate-800 dark:text-white">
                                    The search for a <span className="text-emerald-600">greener</span> web.
                                </h2>
                                <p className="text-slate-500 dark:text-slate-400 text-lg md:text-xl max-w-lg mx-auto">
                                    Choose your search provider and help restore the digital ecosystem.
                                </p>
                            </div>

                            <div className="w-full relative group">
                                <form 
                                    onSubmit={handleSearch}
                                    className="relative flex items-center bg-white dark:bg-slate-900 rounded-[2rem] p-2 shadow-2xl shadow-slate-200 dark:shadow-none border border-slate-100 dark:border-slate-800 transition-all group-hover:border-emerald-500/30 group-focus-within:border-emerald-500/50"
                                >
                                    <div className="relative" ref={dropdownRef}>
                                        <button
                                            type="button"
                                            onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                                            className="flex items-center gap-3 pl-4 pr-3 py-3 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300 font-medium whitespace-nowrap"
                                        >
                                            <div className="w-6 h-6 flex items-center justify-center bg-white dark:bg-slate-800 rounded-md overflow-hidden shadow-sm border border-slate-100 dark:border-slate-700">
                                                <img src={SEARCH_ENGINES[engine].icon} alt="" className="w-4 h-4 object-contain" />
                                            </div>
                                            <span className="hidden sm:inline">{SEARCH_ENGINES[engine].name}</span>
                                            <Icon name="ChevronDown" className={`w-4 h-4 transition-transform ${isDropdownOpen ? 'rotate-180' : ''}`} />
                                        </button>

                                        {isDropdownOpen && (
                                            <div className="absolute left-0 top-full mt-4 w-64 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl shadow-xl overflow-y-auto max-h-[60vh] z-50 p-2 animate-in fade-in slide-in-from-top-2">
                                                {Object.entries(SEARCH_ENGINES).map(([key, info]) => (
                                                    <button
                                                        key={key}
                                                        onClick={() => {
                                                            setEngine(key);
                                                            setIsDropdownOpen(false);
                                                        }}
                                                        className={`w-full flex items-start gap-4 p-3 rounded-xl transition-all text-left ${engine === key ? 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
                                                    >
                                                        <div className={`w-10 h-10 shrink-0 flex items-center justify-center rounded-lg shadow-sm ${engine === key ? 'bg-white' : 'bg-slate-100 dark:bg-slate-800'}`}>
                                                            <img src={info.icon} alt="" className="w-6 h-6 object-contain" />
                                                        </div>
                                                        <div>
                                                            <div className="font-bold">{info.name}</div>
                                                            <div className="text-xs opacity-70 truncate w-36">{info.description}</div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <input 
                                        type="text" 
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                        placeholder={`Search with ${SEARCH_ENGINES[engine].name}...`}
                                        className="flex-1 bg-transparent border-none outline-none px-4 md:px-6 py-4 text-lg text-slate-800 dark:text-white placeholder:text-slate-400"
                                    />

                                    <button 
                                        type="submit"
                                        className="bg-emerald-600 hover:bg-emerald-500 text-white p-4 rounded-full transition-all shadow-lg shadow-emerald-600/20 active:scale-95 flex items-center justify-center focus:ring-2 focus:ring-emerald-500 outline-none"
                                        aria-label="Submit Search"
                                    >
                                        <Icon name="Search" />
                                    </button>
                                </form>

                                <div className="mt-8 flex flex-wrap justify-center gap-6 text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]">
                                    <div className="flex items-center gap-3 px-4 py-2 bg-slate-100/50 dark:bg-slate-800/50 rounded-full border border-slate-200/50 dark:border-slate-700/50">
                                        <img src={SEARCH_ENGINES[engine].icon} alt="" className="w-3 h-3 object-contain" />
                                        <span>Active Provider: {SEARCH_ENGINES[engine].name}</span>
                                    </div>
                                    <div className="flex items-center gap-2.5 px-4 py-2 bg-emerald-50 dark:bg-emerald-900/10 rounded-full border border-emerald-100 dark:border-emerald-800/30 text-emerald-600 dark:text-emerald-500">
                                        <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                                        <span>Eco-Friendly Platform</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <footer className="absolute bottom-8 text-center text-slate-400 text-sm">
                            <p>© 2026 GreenMeans: Search. All results provided by {SEARCH_ENGINES[engine].name}</p>
                        </footer>
                    </main>

                    {/* Settings Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setIsSettingsOpen(false)} />
                            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden z-20 border border-slate-100 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-200">
                                <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                                    <h3 className="text-2xl font-bold flex items-center gap-3">
                                        <Icon name="Settings" className="w-6 h-6 text-emerald-600" />
                                        Settings
                                    </h3>
                                    <button 
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors"
                                    >
                                        <Icon name="X" />
                                    </button>
                                </div>
                                <div className="p-8 space-y-6">
                                    <section>
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Accessibility & Style</h4>
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">
                                                <div className="flex items-center gap-3">
                                                    <Icon name={darkMode ? "Moon" : "Sun"} />
                                                    <span className="font-medium">Dark Mode Appearance</span>
                                                </div>
                                                <button 
                                                    onClick={() => setDarkMode(!darkMode)}
                                                    className={`w-12 h-6 rounded-full transition-colors relative ${darkMode ? 'bg-emerald-600' : 'bg-slate-300'}`}
                                                >
                                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${darkMode ? 'left-7' : 'left-1'}`} />
                                                </button>
                                            </div>

                                            <div className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">
                                                <div className="flex items-center gap-3">
                                                    <Icon name="Type" />
                                                    <div className="flex flex-col">
                                                        <span className="font-medium leading-none">Dyslexia Friendly Font</span>
                                                        <span className="text-[10px] text-slate-400">Open Sans for better readability</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => setDyslexiaMode(!dyslexiaMode)}
                                                    className={`w-12 h-6 rounded-full transition-colors relative ${dyslexiaMode ? 'bg-emerald-600' : 'bg-slate-300'}`}
                                                >
                                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${dyslexiaMode ? 'left-7' : 'left-1'}`} />
                                                </button>
                                            </div>

                                            <div className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">
                                                <div className="flex items-center gap-3">
                                                    <Icon name="ZapOff" />
                                                    <span className="font-medium">Reduce Motion</span>
                                                </div>
                                                <button 
                                                    onClick={() => setReducedMotion(!reducedMotion)}
                                                    className={`w-12 h-6 rounded-full transition-colors relative ${reducedMotion ? 'bg-emerald-600' : 'bg-slate-300'}`}
                                                >
                                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${reducedMotion ? 'left-7' : 'left-1'}`} />
                                                </button>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                                <div className="p-8 bg-slate-50 dark:bg-slate-800/30 text-center">
                                    <p className="text-xs text-slate-400">Your preferences are saved locally on this device.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
