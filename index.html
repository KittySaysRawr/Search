<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreenMeans: Search</title>
    <meta name="description" content="Discover a Greener way to search. GreenMeans lets you choose your favorite search engine whilst being eco-friendly and privacy-focused.">
    <meta name="keywords" content="eco-friendly search, green search, privacy search, search aggregator, Ecosia, DuckDuckGo, private search, climate action, search choices">
    <meta name="author" content="GreenMeans">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://search.greenmeans.ovh/">
    <meta property="og:title" content="GreenMeans: Search">
    <meta property="og:description" content="Choose your favorite search engine. Start reducing your digital footprint one query at a time.">
    <meta property="og:image" content="https://search.greenmeans.ovh/favicon-round.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://search.greenmeans.ovh/">
    <meta property="twitter:title" content="GreenMeans: Search">
    <meta property="twitter:description" content="Choose your favorite search engine. Start reducing your digital footprint one query at a time.">
    <meta property="twitter:image" content="https://search.greenmeans.ovh/favicon-round.svg">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GreenMeans: Search",
      "url": "https://search.greenmeans.ovh/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://search.greenmeans.ovh/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-round.svg">
    <link rel="shortcut icon" href="/favicon-round.svg">
    <link rel="apple-touch-icon" href="/favicon-round.svg">
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        'xs': '475px',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        dyslexic: ['Lexend', 'Open Sans', 'sans-serif'],
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#047857',
                            700: '#065f46',
                            800: '#064e3b',
                            900: '#022c22',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .dyslexia-mode {
            font-family: 'Lexend', 'Open Sans', system-ui, sans-serif !important;
            line-height: 1.8 !important;
            letter-spacing: 0.05em !important;
            word-spacing: 0.1em !important;
        }

        .dyslexia-mode p, .dyslexia-mode h1, .dyslexia-mode h2, .dyslexia-mode h3, .dyslexia-mode span, .dyslexia-mode input {
            font-family: 'Open Sans', system-ui, sans-serif !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            border-radius: 10px;
            background-color: #e2e8f0;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #10b981;
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: #334155;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background-color: #10b981;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-emerald-500 selection:text-white transition-colors duration-300">
    <!-- Screen reader only h1 for SEO matching user requirements -->
    <h1 class="sr-only">GreenMeans: Your Eco-Friendly Search Aggregator for a Greener Web</h1>
    
    <div id="root"></div>

    <!-- React, ReactDOM, Babel, and Lucide CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>

    <!-- App Logic -->
    <script>
        const { useState, useEffect, useRef } = React;
        const h = React.createElement;

        const SEARCH_ENGINES = {
            ecosia: {
                name: 'Ecosia',
                url: 'https://www.ecosia.org/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=ecosia.org&sz=64',
                description: "The search engine that plants trees while you search.",
                details: "Ecosia uses its ad revenue to fund reforestation projects globally. By searching with Ecosia, you help restore landscapes and support local communities, essentially turning your digital footprint into trees.",
                ecoStatus: 'green'
            },
            google: {
                name: 'Google',
                url: 'https://www.google.com/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=google.com&sz=64',
                description: "The world's most popular search engine.",
                details: "Google provides the most comprehensive and powerful search index. While widely used, it is often critiqued for data tracking, though it remains the gold standard for finding information quickly.",
                ecoStatus: 'amber'
            },
            bing: {
                name: 'Bing',
                url: 'https://www.bing.com/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=bing.com&sz=64',
                description: "Microsoft's search experience with rich visual results.",
                details: "Bing combines core search capabilities with AI integration and beautiful daily imagery. It powers many other environmental search engines as a backend provider.",
                ecoStatus: 'red'
            },
            duckduckgo: {
                name: 'DuckDuckGo',
                url: 'https://duckduckgo.com',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=64',
                description: "Privacy-focused search that doesn't track you.",
                details: "DuckDuckGo is the leading advocate for private search. It doesn't store your history or personal info, offering a 'filter-bubble' free experience where everyone gets the same results.",
                ecoStatus: 'amber'
            },
            brave: {
                name: 'Brave Search',
                url: 'https://search.brave.com/search',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=search.brave.com&sz=64',
                description: "Independent, private, and user-first search.",
                details: "Brave Search is built on an independent index, meaning it doesn't rely on Big Tech for its results. It offers a transparent and private alternative to conventional search engines.",
                ecoStatus: 'amber'
            },
            startpage: {
                name: 'Startpage',
                url: 'https://www.startpage.com/do/dsearch',
                queryParam: 'query',
                icon: 'https://www.google.com/s2/favicons?domain=startpage.com&sz=64',
                description: "Google's results with total privacy protection.",
                details: "Startpage allows you to use Google's high-quality search results without Google tracking you. It acts as a middleman, stripping away personal identifiers before querying Google.",
                ecoStatus: 'green'
            },
            qwant: {
                name: 'Qwant',
                url: 'https://www.qwant.com/',
                queryParam: 'q',
                icon: 'https://www.google.com/s2/favicons?domain=qwant.com&sz=64',
                description: "The European search engine that respects your privacy.",
                details: "Based in France, Qwant guarantees it doesn't install cookies or track users. It strictly adheres to European privacy laws and focuses on delivering neutral search results.",
                ecoStatus: 'amber'
            },
            swisscows: {
                name: 'Swisscows',
                url: 'https://swisscows.com/web',
                queryParam: 'query',
                icon: 'https://www.google.com/s2/favicons?domain=swisscows.com&sz=64',
                description: "Anonymous search engine from Switzerland.",
                details: "Swisscows uses its own semantic search technology to deliver anonymous results. They do not store any data and operate out of Switzerland, known for its strong privacy protections.",
                ecoStatus: 'green'
            }
        };

        // Lucide Icons Helper Component
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    lucide.createIcons({
                        attrs: { class: className },
                        nameAttr: 'data-lucide',
                        icons: { [name]: lucide[name] },
                        root: containerRef.current
                    });
                }
            }, [name, className]);

            return h('span', { 
                ref: containerRef, 
                className: "inline-flex items-center justify-center", 
                "aria-hidden": "true" 
            });
        };

        function App() {
            // --- State Persistence ---
            const [query, setQuery] = useState('');
            const [engine, setEngine] = useState(() => {
                const savedEngine = localStorage.getItem('gm-engine');
                return (savedEngine && SEARCH_ENGINES[savedEngine]) ? savedEngine : 'ecosia';
            });
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('gm-dark-mode') === 'true' || 
                       (!('gm-dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });
            const [dyslexiaMode, setDyslexiaMode] = useState(() => localStorage.getItem('gm-dyslexia-mode') === 'true');
            const [cookiesAccepted, setCookiesAccepted] = useState(() => localStorage.getItem('gm-cookies-accepted') === 'true');
            const [isDeclineModalOpen, setIsDeclineModalOpen] = useState(false);
            
            // --- UI State ---
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [expandedEngineKey, setExpandedEngineKey] = useState(null);
            const dropdownRef = useRef(null);
            const searchInputRef = useRef(null);

            // --- Handlers ---
            useEffect(() => {
                localStorage.setItem('gm-engine', engine);
            }, [engine]);

            useEffect(() => {
                localStorage.setItem('gm-cookies-accepted', cookiesAccepted);
            }, [cookiesAccepted]);

            useEffect(() => {
                localStorage.setItem('gm-dyslexia-mode', dyslexiaMode);
                if (dyslexiaMode) {
                    document.body.classList.add('dyslexia-mode');
                } else {
                    document.body.classList.remove('dyslexia-mode');
                }
            }, [dyslexiaMode]);

            useEffect(() => {
                localStorage.setItem('gm-dark-mode', darkMode);
                
                const html = document.documentElement;
                
                if (darkMode) {
                    html.classList.add('dark');
                    html.style.colorScheme = 'dark';
                } else {
                    html.classList.remove('dark');
                    html.style.colorScheme = 'light';
                }

                // Sync Meta Theme Color for mobile status bars
                const themeColor = darkMode ? '#020617' : '#f8fafc';
                let metaTheme = document.querySelector('meta[name="theme-color"]');
                if (!metaTheme) {
                    metaTheme = document.createElement('meta');
                    metaTheme.setAttribute('name', 'theme-color');
                    document.head.appendChild(metaTheme);
                }
                metaTheme.setAttribute('content', themeColor);
            }, [darkMode]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsDropdownOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSearch = (e) => {
                e?.preventDefault();
                if (!query.trim()) return;

                const searchUrl = `${currentEngine.url}?${currentEngine.queryParam}=${encodeURIComponent(query)}`;
                window.open(searchUrl, '_blank');
            };

            const clearSearch = () => {
                setQuery('');
                if (searchInputRef.current) searchInputRef.current.focus();
            };

            const currentEngine = SEARCH_ENGINES[engine] || SEARCH_ENGINES.ecosia;

            return h('div', { className: "flex flex-col min-h-screen relative overflow-x-hidden" }, [
                h('header', { 
                    key: 'header',
                    className: "fixed top-0 left-0 right-0 z-40 px-6 py-4 flex justify-between items-center bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm" 
                }, [
                    h('div', { key: 'logo', className: "flex items-center gap-3 group cursor-default" }, [
                        h('div', { 
                            className: "w-10 h-10 overflow-hidden rounded-full shadow-lg shadow-emerald-600/20 group-hover:rotate-12 transition-transform bg-[#18852b] border border-[#18852b] flex items-center justify-center",
                            "aria-hidden": "true"
                        }, 
                            h('img', { src: "/favicon-square.svg", alt: "GreenMeans Eco-Friendly Search Logo", className: "w-full h-full object-cover rounded-full" })
                        ),
                        h('span', { className: "text-xl font-extrabold tracking-tight text-slate-800 dark:text-white" }, "GreenMeans: Search")
                    ]),
                    h('div', { key: 'nav', className: "flex items-center gap-2" }, [
                        h('a', { 
                            href: "https://greenmeans.ovh",
                            className: "w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:scale-110 active:scale-95 transition-all text-slate-600 dark:text-slate-300",
                            "aria-label": "Home"
                        }, h(Icon, { name: "Home", className: "w-5 h-5" })),
                        h('button', { 
                            onClick: () => setIsSettingsOpen(true),
                            className: "w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:scale-110 active:scale-95 transition-all text-slate-600 dark:text-slate-300",
                            "aria-label": "Settings"
                        }, h(Icon, { name: "Settings", className: "w-5 h-5" }))
                    ])
                ]),
                
                h('main', { 
                    key: 'main',
                    className: "flex-1 flex flex-col items-center justify-center px-4 py-32 relative w-full max-w-4xl mx-auto" 
                }, [
                    h('div', { key: 'bg-blobs', className: "absolute inset-0 overflow-hidden pointer-events-none opacity-50" }, [
                        h('div', { key: 'blob1', className: "absolute inset-0 m-auto w-[40rem] h-[40rem] bg-emerald-500/10 rounded-full -translate-x-1/3 -translate-y-1/4" }),
                        h('div', { key: 'blob2', className: "absolute inset-0 m-auto w-[40rem] h-[40rem] bg-teal-500/10 rounded-full translate-x-1/3 translate-y-1/4" }),
                    ]),
                    
                    h('div', { key: 'content', className: "w-full flex flex-col items-center gap-10 sm:gap-12 z-10" }, [
                        h('div', { className: "text-center animate-in fade-in slide-in-from-bottom-4 duration-700 max-w-2xl px-2" }, [
                            h('h2', { className: "text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mb-6 text-slate-900 dark:text-white leading-[1.15]" }, [
                                "Discover a ",
                                h('span', { 
                                    key: 'highlight', 
                                    className: `text-transparent bg-clip-text bg-gradient-to-r inline-block transition-all duration-500 ${
                                        currentEngine.ecoStatus === 'green' 
                                            ? 'from-emerald-500 to-teal-600' 
                                            : currentEngine.ecoStatus === 'amber'
                                                ? 'from-amber-400 to-orange-600'
                                                : 'from-red-500 to-rose-700'
                                    }` 
                                }, "Greener"),
                                " way to Search."
                            ]),
                            h('p', { className: "text-slate-600 dark:text-slate-400 text-lg sm:text-xl font-medium leading-relaxed" }, 
                                "Pick your search provider and help restore the web’s natural balance."
                            )
                        ]),
                        
                        // Search Component
                        h('div', { className: "w-full max-w-2xl relative group" }, [
                            h('form', { 
                                onSubmit: handleSearch,
                                role: "search",
                                className: "relative flex items-center bg-white dark:bg-slate-900 rounded-[2rem] p-1.5 sm:p-2 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-800 transition-all hover:shadow-2xl hover:shadow-slate-200/50 dark:hover:border-emerald-500/30 focus-within:border-emerald-500/50 focus-within:ring-4 focus-within:ring-emerald-500/10 focus-within:shadow-emerald-500/5 w-full"
                            }, [
                                h('div', { key: 'dropdown', className: "relative shrink-0", ref: dropdownRef }, [
                                    h('button', { 
                                        type: "button",
                                        onClick: () => setIsDropdownOpen(!isDropdownOpen),
                                        "aria-haspopup": "listbox",
                                        "aria-expanded": isDropdownOpen,
                                        "aria-label": `Change search engine (current: ${currentEngine.name})`,
                                        className: "flex items-center gap-2 sm:gap-3 pl-3 pr-2 sm:pl-4 sm:pr-3 py-2.5 sm:py-3 rounded-full hover:bg-slate-100/80 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-200 font-medium whitespace-nowrap"
                                    }, [
                                        h('div', { className: "w-7 h-7 flex items-center justify-center bg-white dark:bg-slate-800 rounded-full overflow-hidden shadow-sm border border-slate-200/60 dark:border-slate-700 shrink-0", "aria-hidden": "true" }, 
                                            h('img', { src: currentEngine.icon, alt: `${currentEngine.name} search engine icon`, className: "w-full h-full object-cover" })
                                        ),
                                        h('span', { className: "hidden xs:inline text-sm sm:text-base font-semibold" }, currentEngine.name),
                                        h(Icon, { name: "ChevronDown", className: `w-4 h-4 text-slate-400 transition-transform ${isDropdownOpen ? 'rotate-180' : ''}` })
                                    ]),
                                    isDropdownOpen && h('div', { 
                                        role: "listbox",
                                        className: "absolute left-0 top-full mt-3 w-72 sm:w-80 bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-2xl shadow-2xl overflow-y-auto max-h-[60vh] z-50 p-2 animate-in fade-in zoom-in-95 origin-top-left" 
                                    }, 
                                        Object.entries(SEARCH_ENGINES).map(([key, info]) => {
                                            const isExpanded = expandedEngineKey === key;
                                            const isSelected = engine === key;
                                            
                                            return h('div', { 
                                                key,
                                                className: `group/item w-full flex flex-col rounded-xl transition-all mb-1 last:mb-0 border ${isSelected ? 'bg-emerald-50/40 dark:bg-emerald-500/5 border-emerald-100/50 dark:border-emerald-500/20' : 'hover:bg-slate-50 dark:hover:bg-slate-800/40 border-transparent'}`
                                            }, [
                                                h('div', { className: "flex items-center gap-3 p-2" }, [
                                                    h('button', { 
                                                        type: 'button',
                                                        role: "option",
                                                        "aria-selected": isSelected,
                                                        onClick: () => {
                                                            setEngine(key);
                                                            setIsDropdownOpen(false);
                                                        },
                                                        className: "flex-1 flex items-center gap-3 text-left group/btn min-w-0"
                                                    }, [
                                                        h('div', { 
                                                            key: 'icon', 
                                                            className: `w-12 h-12 shrink-0 flex items-center justify-center rounded-lg shadow-sm border overflow-hidden transition-transform group-hover/btn:scale-105 ${isSelected ? 'bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700'}`, 
                                                            "aria-hidden": "true" 
                                                        }, 
                                                            h('img', { 
                                                                src: info.icon, 
                                                                alt: `${info.name} icon`, 
                                                                className: "w-full h-full object-cover" 
                                                            })
                                                        ),
                                                        h('div', { key: 'text', className: "min-w-0 flex-1" }, [
                                                            h('div', { className: `font-bold text-sm sm:text-base ${isSelected ? 'text-emerald-900 dark:text-emerald-300' : 'text-slate-800 dark:text-slate-200'}` }, info.name),
                                                            h('div', { 
                                                                className: `text-xs opacity-70 mt-0.5 truncate ${isSelected ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400'}`,
                                                                title: info.description
                                                            }, info.description)
                                                        ])
                                                    ]),
                                                    h('button', {
                                                        type: 'button',
                                                        onClick: (e) => {
                                                            e.stopPropagation();
                                                            setExpandedEngineKey(isExpanded ? null : key);
                                                        },
                                                        className: `w-8 h-8 shrink-0 flex items-center justify-center rounded-full transition-all ${isExpanded ? 'bg-emerald-600 text-white shadow-md rotate-180' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700'}`,
                                                        "aria-label": isExpanded ? "Show less info" : "Show more info"
                                                    }, h(Icon, { name: isExpanded ? "ChevronUp" : "Info", className: "w-4 h-4" }))
                                                ]),
                                                isExpanded && h('div', { 
                                                    className: "px-3 pb-3 pt-1 animate-in slide-in-from-top-2 duration-200" 
                                                }, [
                                                    h('div', { className: "text-xs leading-relaxed text-slate-600 dark:text-slate-400 p-3 bg-white/50 dark:bg-slate-800/30 rounded-lg border border-slate-100/50 dark:border-slate-700/30 shadow-inner italic" }, info.details)
                                                ])
                                            ]);
                                        })
                                    )
                                ]),
                                
                                h('div', { className: "w-px h-8 bg-slate-200/60 dark:bg-slate-700/60 mx-1 shrink-0" }),

                                h('input', { 
                                    key: 'input',
                                    ref: searchInputRef,
                                    type: "text", 
                                    value: query,
                                    onChange: (e) => setQuery(e.target.value),
                                    placeholder: `Search the web...`,
                                    "aria-label": `Search input for ${currentEngine.name}`,
                                    // text-[16px] is critical: it prevents iOS Safari from automatically zooming the page!
                                    className: "flex-1 min-w-0 bg-transparent border-none outline-none px-3 sm:px-4 py-3 sm:py-4 text-[16px] sm:text-lg font-medium text-slate-800 dark:text-white placeholder:text-slate-400/80"
                                }),
                                
                                query.length > 0 && h('button', {
                                    key: 'clear',
                                    type: "button",
                                    onClick: clearSearch,
                                    className: "p-2 mr-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors focus:outline-none active:scale-90",
                                    "aria-label": "Clear search query"
                                }, h(Icon, { name: "X", className: "w-4 h-4 sm:w-5 sm:h-5" })),

                                h('button', { 
                                    key: 'submit',
                                    type: "submit",
                                    className: "bg-emerald-600/90 hover:bg-emerald-500 text-white p-3.5 sm:p-4 rounded-[1.25rem] transition-all shadow-lg shadow-emerald-600/20 active:scale-95 flex items-center justify-center focus:ring-2 focus:ring-emerald-500 outline-none shrink-0",
                                    "aria-label": "Submit Search"
                                }, h(Icon, { name: "Search", className: "w-5 h-5 sm:w-6 sm:h-6" }))
                            ]),
                            
                            h('div', { key: 'status', className: "mt-8 flex flex-wrap justify-center gap-4 sm:gap-6 text-[10px] sm:text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]" }, [
                                h('div', { className: "flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2 bg-slate-100/50 dark:bg-slate-800/50 rounded-full border border-slate-200/50 dark:border-slate-700/50" }, [
                                    h('img', { src: currentEngine.icon, alt: `${currentEngine.name} active provider icon`, className: "w-3 h-3 object-cover" }),
                                    h('span', null, `Active Provider: ${currentEngine.name}`)
                                ]),
                                h('div', { 
                                    className: `flex items-center gap-2 px-3 sm:px-4 py-2 rounded-full border transition-colors duration-500 ${
                                        currentEngine.ecoStatus === 'green' 
                                            ? 'bg-emerald-50 dark:bg-emerald-900/10 border-emerald-100 dark:border-emerald-800/30 text-emerald-600 dark:text-emerald-500' 
                                            : currentEngine.ecoStatus === 'amber'
                                                ? 'bg-amber-50 dark:bg-amber-900/10 border-amber-100 dark:border-amber-800/30 text-amber-600 dark:text-amber-500'
                                                : 'bg-red-50 dark:bg-red-900/10 border-red-100 dark:border-red-800/30 text-red-600 dark:text-red-500'
                                    }` 
                                }, [
                                    h('div', { 
                                        className: `w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full animate-pulse ${
                                            currentEngine.ecoStatus === 'green' 
                                                ? 'bg-emerald-500' 
                                                : currentEngine.ecoStatus === 'amber'
                                                    ? 'bg-amber-500'
                                                    : 'bg-red-500'
                                        }` 
                                    }),
                                    h('span', null, currentEngine.ecoStatus === 'red' ? "Non-Eco-Friendly Platform" : "Eco-Friendly Platform")
                                ])
                            ])
                        ])
                    ])
                ]),
                
                h('footer', { key: 'footer', className: "text-center text-slate-400 text-xs sm:text-sm p-6 mt-auto" }, 
                    h('p', null, `© ${new Date().getFullYear()} GreenMeans: Search. All results provided by ${currentEngine.name}`)
                ),

                // Modals & Banners Layer
                
                // Settings Modal
                isSettingsOpen && h('div', { key: 'modal', className: "fixed inset-0 z-[60] flex items-center justify-center px-4" }, [
                    h('div', { className: "absolute inset-0 bg-slate-900/70", onClick: () => setIsSettingsOpen(false) }),
                    h('div', { className: "bg-white dark:bg-slate-900 rounded-[2rem] sm:rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden z-20 border border-slate-100 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-200" }, [
                        h('div', { className: "p-6 sm:p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50" }, [
                            h('h3', { className: "text-xl sm:text-2xl font-bold flex items-center gap-3 text-slate-800 dark:text-white" }, [
                                h(Icon, { name: "Settings", className: "w-6 h-6 text-emerald-600" }),
                                "Settings"
                            ]),
                            h('button', { 
                                onClick: () => setIsSettingsOpen(false),
                                className: "p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors text-slate-500 dark:text-slate-400",
                                "aria-label": "Close settings"
                            }, h(Icon, { name: "X", className: "w-5 h-5" }))
                        ]),
                        h('div', { className: "p-6 sm:p-8 space-y-6" }, [
                            h('section', null, [
                                h('h4', { className: "text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-4" }, "Accessibility & Style"),
                                h('div', { className: "space-y-3 sm:space-y-4" }, [
                                    [
                                        { name: "Dark Mode Appearance", icon: darkMode ? "Moon" : "Sun", active: darkMode, toggle: () => setDarkMode(!darkMode) },
                                        { name: "Dyslexia Friendly Font", icon: "Type", active: dyslexiaMode, toggle: () => setDyslexiaMode(!dyslexiaMode), subtitle: "Lexend for better readability" }
                                    ].map((opt, i) => 
                                        h('div', { key: i, className: "flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl" }, [
                                            h('div', { className: "flex items-center gap-3 text-slate-700 dark:text-slate-300" }, [
                                                h(Icon, { name: opt.icon, className: "w-5 h-5 shrink-0" }),
                                                h('div', { className: "flex flex-col relative top-px" }, [
                                                    h('span', { className: "font-medium text-sm sm:text-base" + (opt.subtitle ? " leading-none" : "") }, opt.name),
                                                    opt.subtitle && h('span', { className: "text-[10px] sm:text-xs text-slate-400 dark:text-slate-500 mt-0.5" }, opt.subtitle)
                                                ])
                                            ]),
                                            h('button', { 
                                                onClick: opt.toggle,
                                                role: "switch",
                                                type: "button",
                                                "aria-checked": opt.active,
                                                "aria-label": `Toggle ${opt.name}`,
                                                className: `w-12 h-6 rounded-full transition-colors relative shrink-0 ${opt.active ? 'bg-emerald-600' : 'bg-slate-300 dark:bg-slate-600'}`
                                            }, h('div', { className: `absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${opt.active ? 'left-7' : 'left-1'}` }))
                                        ])
                                    )
                                ])
                            ])
                        ]),
                        h('div', { className: "p-6 sm:p-8 bg-slate-50 dark:bg-slate-800/30 text-center border-t border-slate-100 dark:border-slate-800" }, 
                            h('p', { className: "text-xs text-slate-400 dark:text-slate-500" }, "Your preferences are saved locally on this device.")
                        )
                    ])
                ]),

                // Decline modal
                isDeclineModalOpen && h('div', { key: 'decline-modal', className: "fixed inset-0 z-[110] flex items-center justify-center px-4 animate-in fade-in duration-300" }, [
                    h('div', { className: "absolute inset-0 bg-slate-900/70" }),
                    h('div', { className: "bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden z-20 border border-slate-100 dark:border-slate-800 p-6 sm:p-8 text-center animate-in zoom-in-95 duration-200" }, [
                        h('div', { className: "w-16 h-16 bg-amber-100 dark:bg-amber-900/30 rounded-2xl flex items-center justify-center text-amber-600 mx-auto mb-6" }, 
                            h(Icon, { name: "AlertTriangle", className: "w-8 h-8" })
                        ),
                        h('h3', { className: "text-xl font-bold mb-3 text-slate-800 dark:text-white" }, "Cookie Consent Declined"),
                        h('p', { className: "text-slate-500 dark:text-slate-400 text-sm mb-8 leading-relaxed" }, 
                            "By declining non-essential cookies, some features of this website might not function as expected."
                        ),
                        h('button', { 
                            onClick: () => {
                                setIsDeclineModalOpen(false);
                                setCookiesAccepted(true); // Treat "Understood" as completing the interaction
                            },
                            className: "w-full py-3 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white rounded-xl font-semibold transition-all active:scale-95 shadow-lg shadow-slate-900/10"
                        }, "Understood")
                    ])
                ]),

                // Fixed Cookie Banner overlay over the bottom of the viewport
                !cookiesAccepted && h('div', { 
                    key: 'cookie-banner', 
                    // Use a slightly varied wrapper to ensure it sticks purely to viewport bottom regardless of scrolling state
                    className: "fixed bottom-0 left-0 right-0 z-[100] animate-in slide-in-from-bottom-full duration-500" 
                }, [
                    h('div', { 
                        // The pb-[max(env(safe-area-inset-bottom),1rem)] ensures iPhone bottom bar does not hide buttons
                        className: "w-full bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_-5px_30px_rgba(0,0,0,0.3)] p-4 md:p-6 pb-[max(env(safe-area-inset-bottom),1rem)] flex flex-col md:flex-row items-center justify-between gap-4 md:gap-8 mx-auto xl:px-32" 
                    }, [
                        h('div', { className: "flex items-center gap-4 max-w-4xl" }, [
                            h('div', { className: "w-10 h-10 bg-emerald-100 dark:bg-emerald-900/30 rounded-xl flex items-center justify-center text-emerald-600 shrink-0" }, 
                                h(Icon, { name: "Cookie", className: "w-5 h-5" })
                            ),
                            h('p', { className: "text-sm text-slate-600 dark:text-slate-400 leading-relaxed font-medium" }, [
                                "We use cookies to ensure you get the best experience on our website. Read our ",
                                h('a', { 
                                    href: "https://privacy.greenmeans.ovh/", 
                                    target: "_blank", 
                                    rel: "noopener noreferrer",
                                    className: "text-emerald-600 dark:text-emerald-500 font-semibold hover:underline" 
                                }, "Privacy Policy"),
                                "."
                            ])
                        ]),
                        h('div', { className: "flex items-center gap-3 w-full md:w-auto shrink-0 mt-2 md:mt-0" }, [
                            h('button', { 
                                onClick: () => setIsDeclineModalOpen(true),
                                className: "flex-1 md:flex-none px-6 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl font-bold transition-all active:scale-95 whitespace-nowrap"
                            }, "Decline"),
                            h('button', { 
                                onClick: () => setCookiesAccepted(true),
                                className: "flex-1 md:flex-none px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all active:scale-95 whitespace-nowrap shadow-lg shadow-emerald-600/20"
                            }, "Accept")
                        ])
                    ])
                ])
            ]);
        }

        const rootLayout = document.getElementById('root');
        const root = ReactDOM.createRoot(rootLayout);
        root.render(h(App));
    </script>
</body>
</html>
